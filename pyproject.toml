[project]
name = "umbra-reviewer"
version = "0.1.1"
description = "An advisory PR reviewer that surfaces architecture + security issues, cross-verifies them against deterministic gates, and recommends whether a change is safe to merge — never merging on its own judgement."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — All Rights Reserved" }
authors = [{ name = "Binay Dalai" }]
keywords = ["code-review", "security", "pull-request", "github-actions", "supply-chain", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []  # deterministic core is stdlib-only; no runtime deps.

[project.urls]
Homepage = "https://github.com/Signetry/reviewer"
Repository = "https://github.com/Signetry/reviewer"
Umbrella = "https://github.com/Signetry/signetry"

[project.scripts]
umbra-reviewer = "umbra_reviewer.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["umbra_reviewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "RUF"]
